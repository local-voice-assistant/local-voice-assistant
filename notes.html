<div class="card">
<ul>
<li>同一时间只能有一个程序连接录音卡</li>
<li>听写注入需要辅助功能权限；主体是「本地语音助手」App</li>
<li>数据目录：<code>~/Library/Application Support/本地语音助手/</code></li>
<li>音频与转写默认本机处理；配置云端模型后，相关文本会发往你所选服务商</li>
<li>预发布版本功能与稳定性仍在迭代</li>
